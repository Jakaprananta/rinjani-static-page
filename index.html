<!doctype html>
<!--
  Prototipe templat Wisata "Rinjani" — pendakian: bagian pertama adalah adegan lengket (sticky) di mana scroll = mendaki. Dunia (savana → hutan pinus → batuan → puncak)
  bergeser dengan kedalaman berbeda, altimeter & suhu berubah, pos-pos muncul, langit menggelap lalu fajar di puncak. Plus daftar bawaan ransel interaktif dengan cincin kesiapan.
  Satu file berdiri sendiri (HTML + CSS + JS), tanpa gambar eksternal. Lima tampilan sama dengan versi Vue:
  Beranda (hero, destinasi + ketersediaan tanggal, galeri, tentang, kontak), Detail destinasi, Booking (pop up), dan Konfirmasi booking.
  Data & ketersediaan hanya contoh (dihitung deterministik). Bar "Prototipe" di atas hanya alat bantu pratinjau.
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rinjani — Prototipe Wisata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow-x:clip}
body{background:#f2efe8;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* ---- alat prototipe ---- */
.proto-bar{position:sticky;top:0;z-index:200;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 12px;background:#17151c;color:#fff;font:600 12px/1 system-ui,sans-serif}
.proto-bar b{margin-right:6px;white-space:nowrap;opacity:.8}
.proto-bar button{flex:none;border:0;border-radius:999px;padding:8px 12px;background:#2c2935;color:#fff;font:inherit;cursor:pointer}
.proto-bar button.on{background:#fff;color:#17151c}
.view[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:24px;z-index:400;transform:translate(-50%,30px);opacity:0;padding:12px 22px;border-radius:999px;background:#2a1f1a;color:#f6ecd9;font:700 14px "DM Sans",system-ui,sans-serif;transition:.25s;pointer-events:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0);opacity:1}
.burst{position:fixed;z-index:500;pointer-events:none;width:14px;height:14px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.2);opacity:0}}

/* ---- keranjang & checkout (terang, token --co-*) ---- */
:root{--co-text:#7a6657;--co-text-h:#2a1f1a;--co-border:#dccbb0;--co-field-bg:#f8f0e1;--co-soft:#ece0ca;--co-accent:#9c2b2e;--co-accent-dark:#7a1f22;--co-dialog-bg:#fbf5ea;--co-font:"DM Sans",system-ui,sans-serif;--co-display:"Fraunces",Georgia,serif;--co-radius:18px;--co-ctl-radius:12px}
.co-overlay{position:fixed;inset:0;z-index:300;background:rgba(18,28,24,.6);backdrop-filter:blur(2px)}
.co-overlay[hidden],.co-dialog[hidden]{display:none}
.co-band{height:10px;background:var(--co-band,#c62839)}
.co-drawer{position:fixed;top:0;right:0;bottom:0;z-index:310;width:min(440px,100%);background:var(--co-dialog-bg);display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .34s cubic-bezier(.3,.8,.3,1),visibility 0s .34s;box-shadow:-20px 0 50px -20px rgba(0,0,0,.5);font-family:var(--co-font);color:var(--co-text)}
.co-drawer.show{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.3,.8,.3,1)}
.co-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--co-border)}
.co-head h2{margin:0;font-family:var(--co-display);font-weight:600;font-size:30px;color:var(--co-text-h)}
.co-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--co-soft);color:var(--co-text-h);font-size:16px;cursor:pointer}
.co-body{flex:1;overflow:auto;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.co-item{display:flex;gap:14px;align-items:center;padding:12px;border-radius:var(--co-ctl-radius);background:var(--co-field-bg);border:1px solid var(--co-border)}
.co-th{flex:none;position:relative;width:62px;height:76px;border-radius:999px 999px 8px 8px;overflow:hidden;background:#f0dcc4}
.co-th .ph-emoji i{font-size:30px !important}
.co-info{flex:1;display:flex;flex-direction:column;gap:3px;font-size:13px}.co-info b{color:var(--co-text-h);font-size:14.5px}
.co-qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.co-qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--co-soft);color:var(--co-text-h);font-weight:800;cursor:pointer}
.co-qty button:disabled{opacity:.4}
.co-rm{border:0;background:none;color:var(--co-accent);font-weight:800;cursor:pointer;font-size:12px}
.co-empty{margin:auto;text-align:center;font-weight:700;line-height:1.6;font-family:var(--co-display);font-size:20px}
.co-mascot{width:110px;margin:0 auto 12px}.co-mascot svg{width:100%}
.co-note{padding:10px 14px;border-radius:12px;background:#e6efe0;color:#27523f;font-size:13px;font-weight:700}
.co-foot{padding:18px 24px;border-top:1px solid var(--co-border)}
.co-sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.co-sum b{font-family:var(--co-display);font-weight:700;font-size:26px;color:var(--co-accent-dark)}
.co-btn{width:100%;min-height:50px;border:0;border-radius:var(--co-ctl-radius);background:var(--co-accent);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.co-btn:disabled{opacity:.5;cursor:not-allowed}
.co-dialog{position:fixed;inset:0;z-index:320;display:grid;place-items:center;padding:16px;pointer-events:none;font-family:var(--co-font);color:var(--co-text)}
.co-card{pointer-events:auto;width:min(500px,100%);max-height:92vh;overflow:auto;background:var(--co-dialog-bg);border-radius:var(--co-radius);box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.co-form{padding:16px 24px 24px;display:grid;gap:12px}
.co-form label{display:grid;gap:5px;font-size:13px;font-weight:800;color:var(--co-text-h)}
.co-form input,.co-form textarea,.co-form select{padding:11px 13px;border-radius:var(--co-ctl-radius);border:1.5px solid var(--co-border);background:var(--co-field-bg);color:var(--co-text-h);font:inherit;font-weight:600}
.co-form input:focus,.co-form textarea:focus,.co-form select:focus{outline:3px solid color-mix(in srgb,var(--co-accent) 28%,transparent);border-color:var(--co-accent)}
.co-pay{padding:10px 12px;border-radius:var(--co-ctl-radius);background:var(--co-soft);font-size:13px;font-weight:600}
.co-line{display:flex;justify-content:space-between;font-weight:700;font-size:14px}


/* ===== CSS dasar Wisata (corew.js). Tema mengisi variabel di .mt-rin lalu menimpa gaya. ===== */
.mt-rin{width:100%;font-family:var(--fb);color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:clip;position:relative}
.mt-rin *{box-sizing:border-box}
.mt-rin :is(h1,h2,h3,h4,p){margin:0;text-align:left;letter-spacing:normal}
.mt-rin a{color:inherit}.mt-rin svg{display:block}
.mt-rin .rin-wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mt-rin .rin-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);color:var(--nav-ink,var(--ink));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mt-rin .rin-nav-in{display:flex;align-items:center;gap:22px;height:68px}
.mt-rin .rin-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fd);font-weight:700;font-size:26px;white-space:nowrap;min-width:0}
.mt-rin .rin-brand-logo{width:32px;height:32px;flex:none}.mt-rin .rin-brand-logo svg{width:100%;height:100%}
.mt-rin .rin-links{display:flex;gap:6px;margin-left:12px}
.mt-rin .rin-links a{padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;opacity:.78;transition:.2s}.mt-rin .rin-links a:hover{opacity:1;background:color-mix(in srgb,currentColor 10%,transparent)}
.mt-rin .rin-nav-r{margin-left:auto}
.mt-rin .rin-cta-nav,.mt-rin .rin-btn,.mt-rin .rin-book{border:0;border-radius:var(--rb,999px);background:var(--accent);color:var(--on-accent);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--accent-d);transition:transform .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.mt-rin .rin-cta-nav{min-height:42px;padding:0 20px;font-size:14px}.mt-rin .rin-btn{min-height:52px;padding:0 28px;font-size:15px;box-shadow:0 6px 0 var(--accent-d)}.mt-rin .rin-book{min-height:40px;padding:0 18px;font-size:14px}
.mt-rin .rin-cta-nav:hover,.mt-rin .rin-btn:hover:not(:disabled),.mt-rin .rin-book:hover:not(:disabled){transform:translateY(-2px)}.mt-rin .rin-btn:active:not(:disabled),.mt-rin .rin-book:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.mt-rin .rin-btn:disabled,.mt-rin .rin-book:disabled{opacity:.45;cursor:not-allowed}
.mt-rin .rin-link{font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:3px}
/* lapisan pemandangan */
.mt-rin .rin-scene{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.mt-rin .rin-ly{position:absolute;left:0;right:0;bottom:0;will-change:transform}.mt-rin .rin-ly.top{bottom:auto;top:0}
.mt-rin .rin-ly svg{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}.mt-rin .rin-ly.top svg{top:0;bottom:auto}
.mt-rin .rin-parts{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.mt-rin .rin-pt{position:absolute;top:-4%;aspect-ratio:1;animation:rin-fall linear infinite}.mt-rin .rin-pt svg{width:100%;height:100%}
@keyframes rin-fall{0%{transform:translate3d(0,-20px,0) rotate(0)}50%{transform:translate3d(30px,400px,0) rotate(120deg)}100%{transform:translate3d(-18px,820px,0) rotate(260deg)}}
.mt-rin .tw{animation:rin-tw 3.4s ease-in-out infinite}@keyframes rin-tw{0%,100%{opacity:1}50%{opacity:.25}}
.mt-rin .drift{animation:rin-drift 50s linear infinite alternate}@keyframes rin-drift{from{transform:translateX(-70px)}to{transform:translateX(90px)}}
.mt-rin .bob{animation:rin-bob 4.5s ease-in-out infinite}@keyframes rin-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mt-rin .rin-band{position:relative;overflow:hidden;pointer-events:none}.mt-rin .rin-bl{position:absolute;inset:0;will-change:transform}.mt-rin .rin-bl svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
/* seksi */
.mt-rin .rin-sec{padding:80px 0 16px;position:relative}
.mt-rin .rin-head{margin-bottom:32px;max-width:680px}
.mt-rin .rin-kicker{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.mt-rin .rin-head h2{font-family:var(--fd);font-weight:700;font-size:clamp(34px,5vw,56px);line-height:1.04;margin-top:10px}
.mt-rin .rin-head p{margin-top:12px;color:var(--muted);line-height:1.7;font-size:16.5px}
/* destinasi */
.mt-rin .rin-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:30px}
.mt-rin .rin-tab{min-height:40px;padding:0 18px;border-radius:var(--rb,999px);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.18s}
.mt-rin .rin-tab:hover{border-color:var(--accent)}.mt-rin .rin-tab.is-on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mt-rin .rin-date{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 6px 0 14px;border-radius:var(--rb,999px);border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;margin-left:auto}
.mt-rin .rin-date input{min-height:34px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600}
.mt-rin .rin-clr{border:0;background:none;color:var(--accent);font:inherit;font-weight:800;font-size:13px;cursor:pointer;text-decoration:underline}
.mt-rin .rin-search{flex:1;min-width:180px;max-width:260px;min-height:40px;padding:0 18px;border-radius:var(--rb,999px);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.mt-rin .rin-search::placeholder{color:var(--muted)}.mt-rin .rin-search:focus{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
.mt-rin .rin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px 24px}
.mt-rin .rin-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;display:flex;flex-direction:column}
.mt-rin .rin-card:hover{transform:translateY(-8px)}.mt-rin .rin-card.is-full{opacity:.7}
.mt-rin .rin-card-img{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--ph,#ddd)}
.mt-rin .rin-card-img svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1,.5,1)}.mt-rin .rin-card:hover .rin-card-img svg{transform:scale(1.08)}
.mt-rin .rin-chip{position:absolute;left:12px;top:12px;z-index:2;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.92);color:#222;font-size:12px;font-weight:800}
.mt-rin .rin-best{position:absolute;right:12px;top:12px;z-index:2;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11.5px;font-weight:800;letter-spacing:.04em}
.mt-rin .rin-av{position:absolute;left:12px;bottom:12px;z-index:2;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#1f8a4c;color:#fff}.mt-rin .rin-av.low{background:#e0951c}.mt-rin .rin-av.full,.mt-rin .rin-av.off{background:#6b6b73}
.mt-rin .rin-card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.mt-rin .rin-card-name{font-family:var(--fd);font-weight:700;font-size:21px;line-height:1.2;text-decoration:none}
.mt-rin .rin-loc,.mt-rin .rin-rate{font-size:13px;color:var(--muted);font-weight:600}.mt-rin .rin-rate b{color:#e0a526}
.mt-rin .rin-card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px}
.mt-rin .rin-card-foot small{display:block;font-size:11.5px;color:var(--muted)}.mt-rin .rin-card-foot div{display:flex;flex-direction:column}
.mt-rin .rin-price{font-family:var(--fd);font-weight:700;font-size:23px;color:var(--accent);line-height:1.1}
.mt-rin .rin-empty{padding:54px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);font-family:var(--fd);font-size:22px}
/* galeri */
.mt-rin .rin-gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px}
.mt-rin .rin-gi{position:relative;margin:0;border-radius:calc(var(--r) - 4px);overflow:hidden;background:var(--ph);box-shadow:var(--shadow)}
.mt-rin .rin-gi svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .7s}.mt-rin .rin-gi:hover svg{transform:scale(1.1)}
.mt-rin .rin-gi figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));color:#fff;font-weight:700;font-size:14px}
.mt-rin .gi0{grid-column:span 2;grid-row:span 2}.mt-rin .gi3{grid-row:span 2}.mt-rin .gi4{grid-column:span 2}
/* tentang & footer */
.mt-rin .rin-about{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.mt-rin .rin-about h2{font-family:var(--fd);font-weight:700;font-size:clamp(34px,4.6vw,52px);line-height:1.06;margin:10px 0 14px}.mt-rin .rin-about p{color:var(--muted);line-height:1.8;font-size:16.5px}
.mt-rin .rin-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}.mt-rin .rin-facts div{padding:16px;border-radius:14px;background:var(--soft)}.mt-rin .rin-facts b{display:block;font-family:var(--fd);font-size:30px;color:var(--accent)}.mt-rin .rin-facts span{font-size:13px;color:var(--muted);font-weight:600}
.mt-rin .rin-about-art{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3;background:var(--soft)}.mt-rin .rin-about-art svg{width:100%;height:100%}
.mt-rin .rin-foot{margin-top:90px;padding:56px 0 36px;background:var(--foot-bg,var(--soft));color:var(--foot-ink,var(--muted));font-size:14.5px}
.mt-rin .rin-foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px;margin-bottom:30px}
.mt-rin .rin-foot b{display:block;font-family:var(--fd);font-size:28px;color:var(--foot-h,var(--ink));margin-bottom:8px}.mt-rin .rin-foot h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;color:var(--foot-h,var(--ink))}
.mt-rin .rin-foot a{display:block;text-decoration:none;padding:3px 0;opacity:.9}.mt-rin .rin-foot p{line-height:1.8}
.mt-rin .rin-wa{display:inline-flex !important;margin-top:12px;padding:9px 18px !important;border-radius:999px;background:#25a85a;color:#fff;font-weight:800}
/* muncul */
.mt-rin .rv{opacity:0;transform:translateY(34px) scale(.97);transition:opacity .7s ease,transform .8s cubic-bezier(.3,1.4,.5,1)}.mt-rin .rv.in{opacity:1;transform:none}
.mt-rin .rin-grid .rv:nth-child(3n+2){transition-delay:.08s}.mt-rin .rin-grid .rv:nth-child(3n){transition-delay:.16s}
/* detail */
.mt-rin.rin-d .rin-d-banner{position:relative;height:420px;overflow:hidden;background:var(--hero-bg)}
.mt-rin.rin-d .rin-d-banner>svg{position:absolute;inset:0;width:100%;height:100%}
.mt-rin.rin-d .rin-d-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.mt-rin.rin-d .rin-d-banner-in{position:absolute;left:0;right:0;bottom:30px;z-index:2;color:#fff}
.mt-rin.rin-d .rin-d-banner-in h1{font-family:var(--fd);font-weight:700;font-size:clamp(38px,6vw,68px);line-height:1;margin:12px 0 10px;text-shadow:0 4px 24px rgba(0,0,0,.5)}.mt-rin.rin-d .rin-d-banner-in p{font-weight:600}.mt-rin.rin-d .rin-d-banner-in .rin-chip{position:static;display:inline-block}
.mt-rin.rin-d .rin-d-main{display:grid;grid-template-columns:1.6fr 1fr;gap:50px;padding-top:44px;align-items:start}
.mt-rin.rin-d .rin-d-lead{font-size:18px;line-height:1.8;color:var(--muted)}
.mt-rin.rin-d .rin-d-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.mt-rin.rin-d .rin-d-chips span{padding:7px 16px;border-radius:999px;background:var(--soft);font-weight:700;font-size:13.5px}
.mt-rin.rin-d .rin-d-h{font-family:var(--fd);font-size:28px;margin:34px 0 16px}
.mt-rin.rin-d .rin-itin{list-style:none;margin:0;padding:0;display:grid;gap:0}.mt-rin.rin-d .rin-itin li{display:flex;gap:16px;position:relative;padding-bottom:22px}
.mt-rin.rin-d .rin-itin li:not(:last-child)::after{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--line)}
.mt-rin.rin-d .rin-itin i{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-style:normal;font-weight:800;z-index:1}
.mt-rin.rin-d .rin-itin b{font-size:17px}.mt-rin.rin-d .rin-itin p{margin-top:4px;color:var(--muted);line-height:1.7}
.mt-rin.rin-d .rin-d-cols{display:grid;grid-template-columns:1fr 1fr;gap:30px}.mt-rin.rin-d .rin-ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}.mt-rin.rin-d .rin-ul li{padding-left:28px;position:relative;line-height:1.5}
.mt-rin.rin-d .rin-ul.ok li::before{content:"✓";position:absolute;left:0;color:#1f8a4c;font-weight:800}.mt-rin.rin-d .rin-ul.no li::before{content:"✕";position:absolute;left:0;color:#c04a3a;font-weight:800}
.mt-rin.rin-d .rin-d-card{position:sticky;top:90px;padding:26px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.mt-rin.rin-d .rin-d-price{font-family:var(--fd);font-weight:700;font-size:40px;color:var(--accent);line-height:1.1}.mt-rin.rin-d .rin-d-price span{font-family:var(--fb);font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}

const P = D.p
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const rp = (n) => 'Rp ' + Number(n).toLocaleString('id-ID')

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))

const rnd = (i, k = 0) => { const x = Math.sin((i + 1) * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x) }

const STEPS = ['Menunggu pembayaran', 'Pembayaran dikonfirmasi', 'Jadwal dikunci', 'Perjalanan', 'Selesai']

// ---------- tanggal & ketersediaan (contoh: dihitung deterministik) ----------
const iso = (d) => d.toISOString().slice(0, 10)
const addDays = (n) => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return iso(d) }
const fmtDate = (s) => new Date(s + 'T12:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
const fmtShort = (s) => new Date(s + 'T12:00:00').toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })
function hash(a, b) { let h = 2166136261; const s = a + '|' + b; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return Math.abs(h) }
function avail(d, s) {
  if (!s) return null
  const dow = new Date(s + 'T12:00:00').getDay()
  if (d.off && d.off.includes(dow)) return { left: 0, state: 'off' }
  const v = hash(d.id, s) % 100; let left
  if (v < 16) left = 0; else if (v < 42) left = 1 + (v % 3); else left = Math.max(4, d.max - (v % 5))
  left = Math.min(left, d.max)
  return { left, state: left === 0 ? 'full' : left <= 3 ? 'low' : 'ok' }
}
const availText = (a) => !a ? '' : a.state === 'off' ? 'Tidak beroperasi' : a.state === 'full' ? 'Penuh' : a.state === 'low' ? `Tinggal ${a.left} kursi` : `${a.left} kursi tersedia`
const destOf = (id) => DESTS.find((d) => d.id === +id)
const catOf = (d) => CATS.find((c) => c.id === d.cat)

// ---------- kerangka umum ----------
function nav(back) {
  return `<header class="${P}-nav"><div class="${P}-wrap ${P}-nav-in">
  <a class="${P}-brand" href="#" data-go="shop"><span class="${P}-brand-logo" aria-hidden="true">${D.brand}</span><span class="${P}-brand-name">${back ? '← ' : ''}${SITE.name}</span></a>
  ${back ? `<span class="${P}-links"></span>` : `<nav class="${P}-links">${D.links.map((l) => `<a href="#" data-scroll="${l[1]}">${l[0]}</a>`).join('')}</nav>`}
  <span class="${P}-nav-r"><button type="button" class="${P}-cta-nav" data-scroll="${P}-destinasi" data-go-shop="1">Pesan sekarang</button></span>
</div></header>`
}
function foot() { return `<footer class="${P}-foot" id="${P}-kontak"><div class="${P}-wrap"><div class="${P}-foot-grid"><div><b>${SITE.name}</b><p>${SITE.tagline}</p></div><div><h4>Kontak</h4><p>${SITE.address}<br>${SITE.email}<br>${SITE.phone}</p><a class="${P}-wa" href="#" data-wa="1">💬 Chat WhatsApp</a></div><div><h4>Jelajahi</h4>${D.links.map((l) => `<a href="#" data-scroll="${l[1]}">${l[0]}</a>`).join('')}</div></div><small>© ${SITE.name} · Didukung MechioApps</small></div></footer>` }
function band(layers, h, cls = '') { return `<div class="pxb ${P}-band ${cls}" style="height:${h}px" aria-hidden="true">${layers.map(([html, sp, x, rot, st]) => `<div class="${P}-bl" data-ps="${sp}" data-x="${x || 0}" ${rot ? `data-rot="${rot}"` : ''} style="${st || ''}">${html}</div>`).join('')}</div>` }

// ---------- destinasi: grid + filter (kategori, kata kunci, tanggal) ----------
function destSection(head) {
  return `<section id="${P}-destinasi" class="${P}-sec"><div class="${P}-wrap">
  <div class="${P}-head rv"><span class="${P}-kicker">${head[0]}</span><h2 id="ws-destinasi-title">${head[1]}</h2>${head[2] ? `<p>${head[2]}</p>` : ''}</div>
  <div class="${P}-tools" id="${P}-kategori"><button class="${P}-tab is-on" data-tab="0">Semua</button>${CATS.map((c) => `<button class="${P}-tab" data-tab="${c.id}">${c.e} ${c.name}</button>`).join('')}
    <label class="${P}-date"><span>📅 Tanggal</span><input id="dsel" type="date" min="${addDays(1)}" value="${SEL}"></label><button class="${P}-clr" data-clr style="display:${SEL ? '' : 'none'}">Hapus tanggal</button>
    <input class="${P}-search" id="q" type="search" placeholder="Cari destinasi…" aria-label="Cari destinasi"></div>
  <div id="dgrid"></div></div></section>`
}
function setTab(id) { tab = +id; $$('.' + P + '-tab').forEach((b) => b.classList.toggle('is-on', +b.dataset.tab === tab)); drawGrid() }
function drawGrid() {
  const el = $('#dgrid'); if (!el) return; setTimeout(observe)
  let list = DESTS.filter((d) => (!tab || d.cat === tab) && (!query || d.name.toLowerCase().includes(query) || d.loc.toLowerCase().includes(query)))
  if (HOOK.sort) list = HOOK.sort(list)
  if (SEL) list = [...list].sort((a, b) => (avail(b, SEL).left > 0) - (avail(a, SEL).left > 0))
  el.innerHTML = list.length ? `<div class="${P}-grid">${list.map(destCard).join('')}</div>` : `<div class="${P}-empty">Belum ada destinasi yang cocok.</div>`
  const clr = $('.' + P + '-clr'); if (clr) clr.style.display = SEL ? '' : 'none'
}
function destCard(d) {
  const a = avail(d, SEL), full = a && a.left === 0
  return `<article class="${P}-card${RV}${full ? ' is-full' : ''}${HOOK.cardClass ? ' ' + HOOK.cardClass(d) : ''}" data-dest-card="${d.id}">
  <a class="${P}-card-img" href="#" data-detail="${d.id}">${d.art}<span class="${P}-chip">${catOf(d).e} ${catOf(d).name}</span>${d.best ? `<span class="${P}-best">${d.best}</span>` : ''}${a ? `<span class="${P}-av ${a.state}">${availText(a)}</span>` : ''}</a>
  <div class="${P}-card-body"><a class="${P}-card-name" href="#" data-detail="${d.id}">${d.name}</a>
    <span class="${P}-loc">📍 ${d.loc} · ⏱ ${d.days}</span><span class="${P}-rate"><b>★</b> ${d.rating.toFixed(1)} · ${d.reviews} ulasan</span>
    <div class="${P}-card-foot"><div><small>Mulai dari</small><span class="${P}-price">${rp(d.price)}</span><small>/orang</small></div><button class="${P}-book" data-book="${d.id}" ${full ? 'disabled' : ''}>${full ? 'Penuh' : 'Pesan'}</button></div></div></article>`
}
function galleryHTML(tiles) { return `<section id="${P}-galeri" class="${P}-sec"><div class="${P}-wrap"><div class="${P}-head rv"><span class="${P}-kicker">${D.galleryHead[0]}</span><h2>${D.galleryHead[1]}</h2></div><div class="${P}-gallery rv">${tiles.map((t, i) => `<figure class="${P}-gi gi${i % 6}" style="--ph:${t[2] || '#ddd'}">${t[0]}<figcaption>${t[1]}</figcaption></figure>`).join('')}</div></div></section>` }

// ---------- booking ----------
function openBook(id) {
  BK.dest = +id; BK.date = SEL || ''; BK.pax = Math.min(2, destOf(id).max)
  $('#bkDate').min = addDays(1); $('#bkDate').value = BK.date
  $('#dialog').hidden = false; $('#coOverlay').hidden = false; updBook(); HOOK.bookOpen(destOf(id))
}
function closeBook() { $('#dialog').hidden = true; $('#coOverlay').hidden = true }

// ---------- tampilan, event ----------
function show(v, then) {
  ['shop', 'detail', 'track'].forEach((k) => { $('#v-' + k).hidden = k !== v })
  $$('.proto-bar button').forEach((b) => b.classList.toggle('on', b.dataset.view === v))
  if (v === 'shop' && !$('#v-shop').innerHTML.trim()) renderShop()
  if (v === 'detail') renderDetail()
  if (v === 'track') renderTrack()
  window.scrollTo({ top: 0 }); observe()
  if (then) setTimeout(() => document.getElementById(then)?.scrollIntoView({ behavior: 'smooth' }), 60)
}
function view(v) {
  if (v === 'book') { if ($('#v-shop').hidden && $('#v-detail').hidden) show('shop'); openBook(BK.dest || 1); $$('.proto-bar button').forEach((b) => b.classList.toggle('on', b.dataset.view === 'book')); return }
  closeBook(); show(v)
}
let toastT
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200) }
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,a,[data-go]'); if (!t) return
  const d = t.dataset
  if (d.view) return view(d.view)
  if (HOOK.click(e, t, d)) return
  if (d.wa !== undefined) { e.preventDefault(); toast('💬 Membuka WhatsApp ' + SITE.phone); return }
  if (d.book) { e.preventDefault(); openBook(d.book); return }
  if (d.detail) { e.preventDefault(); detailId = +d.detail; show('detail'); return }
  if (d.go) { e.preventDefault(); show(d.go, d.then); return }
  if (d.scroll) { e.preventDefault(); if (d.goShop && $('#v-shop').hidden) { show('shop', d.scroll) } else document.getElementById(d.scroll)?.scrollIntoView({ behavior: 'smooth' }); return }
  if (d.tab !== undefined) { HOOK.tab(+d.tab, t); return }
  if (d.clr !== undefined) { SEL = ''; $$('#dsel').forEach((i) => { i.value = '' }); drawGrid(); if (!$('#v-detail').hidden) renderDetail(); return }
  if (d.pax) { BK.pax = Math.max(1, BK.pax + +d.pax); updBook(); return }
  if (t.id === 'dlgX' || t.id === 'bkCancel') closeBook()
  if (t.id === 'advance') { status = Math.min(STEPS.length, status + 1); renderTrack() }
})
$('#coOverlay').addEventListener('click', closeBook)
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { query = e.target.value.trim().toLowerCase(); drawGrid() }
  if (e.target.id === 'bkDate') { BK.date = e.target.value; updBook() }
})
document.addEventListener('change', (e) => {
  if (e.target.id === 'dsel') { SEL = e.target.value; drawGrid(); if (!$('#v-detail').hidden) renderDetail(); HOOK.onDate && HOOK.onDate(SEL) }
})
$('#coForm').addEventListener('submit', (e) => {
  e.preventDefault(); const d = destOf(BK.dest), f = new FormData(e.target)
  lastBooking = { code: 'WS-' + Math.random().toString(36).slice(2, 8).toUpperCase(), dest: d.id, date: BK.date, pax: BK.pax, name: f.get('nama'), wa: f.get('wa'), total: d.price * BK.pax }
  status = 0; closeBook(); show('track'); toast(D.bookToast)
})

// ---------- parallax (scroll + kursor), partikel, muncul saat digulir ----------
let io
function observe() {
  const els = $$('.rv:not(.in)')
  if (reduced || !('IntersectionObserver' in window)) return els.forEach((e) => e.classList.add('in'))
  io = io || new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target) } }), { threshold: 0.08 })
  els.forEach((e) => io.observe(e))
}
function snow(box, n, svg, minS = 5, maxS = 18, durBase = 14) {
  if (!box || reduced) return
  n = innerWidth < 760 ? Math.ceil(n * 0.55) : n
  box.innerHTML = Array.from({ length: n }, (_, i) => { const r = (k) => rnd(i, k + 40), size = minS + Math.pow(r(1), 2) * (maxS - minS)
    return `<span class="${P}-pt" style="left:${(r(2) * 100).toFixed(1)}%;width:${size.toFixed(0)}px;opacity:${(0.45 + r(5) * 0.55).toFixed(2)};animation-duration:${(durBase + (1 - size / maxS) * 16 + r(3) * 8).toFixed(1)}s;animation-delay:-${(r(4) * 30).toFixed(1)}s">${svg}</span>` }).join('')
}
let mx = 0, my = 0, tx = 0, ty = 0
function parallax() {
  if (reduced) return
  const root = $('#v-shop'), ls = $$('[data-speed]', root), bands = $$('.pxb', root); let raf = 0
  const run = () => {
    raf = 0; const y = Math.min(window.scrollY, 1100)
    mx += (tx - mx) * 0.08; my += (ty - my) * 0.08
    ls.forEach((l) => { const dx = (l.dataset.x || 0) * mx; l.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + (y * l.dataset.speed + (l.dataset.x || 0) * my * 0.4).toFixed(1) + 'px,0)' })
    bands.forEach((b) => { const r = b.getBoundingClientRect(); if (r.bottom < -200 || r.top > innerHeight + 200) return; const mid = r.top + r.height / 2 - innerHeight / 2; $$('[data-ps]', b).forEach((l) => { const dx = (l.dataset.x || 0) * mx; l.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + (-mid * l.dataset.ps).toFixed(1) + 'px,0) rotate(' + (l.dataset.rot ? (-mid * l.dataset.rot).toFixed(2) : 0) + 'deg)' }) })
    if (HOOK.onScroll) HOOK.onScroll()
    if (Math.abs(tx - mx) > 0.002 || Math.abs(ty - my) > 0.002) raf = requestAnimationFrame(run)
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(run) }
  addEventListener('scroll', kick, { passive: true })
  if (matchMedia('(pointer: fine)').matches) addEventListener('pointermove', (e) => { tx = e.clientX / innerWidth - 0.5; ty = e.clientY / innerHeight - 0.5; kick() }, { passive: true })
  run()
}
HOOK.tab = (id, t) => { setTab(id); if (t && t.dataset.jump) document.getElementById(P + '-destinasi')?.scrollIntoView({ behavior: 'smooth' }) }
function boot() {
  renderShop(); observe(); parallax(); HOOK.boot()
  const h = location.hash.slice(1)
  if (['detail', 'book', 'track'].includes(h)) view(h)
  else if (h) setTimeout(() => document.getElementById(h)?.scrollIntoView(), 120)
}

// ===== Rinjani: adegan mendaki (sticky) + daftar bawaan ransel =====
const GEAR_ON = new Set([0, 5])
const lerp = (a, b, t) => a + (b - a) * t
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('')
let lastP = -1
const SKY = [[0, '#6fb4e8', '#fbeed0'], [.5, '#3f7fc8', '#cfe0f0'], [.85, '#16275a', '#6a7ab8'], [1, '#1a2a5a', '#f4a76a']]
function skyAt(p) { for (let i = 0; i < SKY.length - 1; i++) { const A = SKY[i], B = SKY[i + 1]; if (p <= B[0]) { const t = (p - A[0]) / (B[0] - A[0]); return [mix(A[1], B[1], t), mix(A[2], B[2], t)] } } return [SKY[3][1], SKY[3][2]] }
function updateClimb(p) {
  const st = $('.rin-stick'); if (!st) return
  const vh = st.clientHeight, H = 2600
  $$('.rin-w', st).forEach((w) => { const f = +w.dataset.f, sway = Math.sin(p * 18) * 26 * f; w.style.transform = `translate3d(${sway.toFixed(1)}px,${(p * (H - vh) * f).toFixed(1)}px,0)` })
  const [a, b] = skyAt(p); st.style.setProperty('--s1', a); st.style.setProperty('--s2', b); st.style.setProperty('--so', Math.max(0, (p - .55) * 2.4).toFixed(2))
  const e = 1 - Math.pow(1 - p, 1.6), alt = Math.round(lerp(1156, 3726, p < .5 ? p * 1.0 : p)), temp = Math.round(lerp(27, 1, p))
  $('#rinAlt').textContent = alt.toLocaleString('id-ID'); $('#rinTmp').textContent = `Suhu ${temp}°C`
  $('#rinFill').style.height = (p * 100).toFixed(1) + '%'
  const hero = $('.rin-hero-txt'); hero.style.opacity = Math.max(0, 1 - p / .07).toFixed(2); $('.rin-hint').style.opacity = Math.max(0, 1 - p / .05).toFixed(2)
  let cur = 0; D.stations.forEach((s, i) => { if (p >= s[0] - .04) cur = i }); $$('.rin-dot').forEach((d, i) => d.classList.toggle('on', i <= cur))
  const near = D.stations.findIndex((s) => Math.abs(p - s[0]) < .055), card = $('#rinStn')
  if (near >= 0) { const s = D.stations[near]; card.innerHTML = `<b>${s[1]}</b><span>${s[2].toLocaleString('id-ID')} mdpl · ${s[3]}</span>`; card.classList.add('show') } else card.classList.remove('show')
  $('#rinEnd').classList.toggle('show', p > .94)
}
const FIXP = new URLSearchParams(location.search).get('p')
HOOK.onScroll = () => { if (FIXP !== null) { if (lastP !== +FIXP) { lastP = +FIXP; updateClimb(+FIXP) } return }; const el = $('.rin-climb'); if (!el) return; const sh = $('.rin-stick').clientHeight, r = el.getBoundingClientRect(), total = r.height - sh, p = Math.max(0, Math.min(1, -(r.top - 68) / total)); if (Math.abs(p - lastP) < .0004) return; lastP = p; updateClimb(p) }
function drawRing() {
  const n = GEAR_ON.size, tot = D.gear.length, C = 2 * Math.PI * 100
  const fg = $('#rinFg'); if (!fg) return; fg.style.strokeDasharray = C; fg.style.strokeDashoffset = C * (1 - n / tot)
  $('#rinPct').textContent = Math.round(n / tot * 100) + '%'
  $('#rinTip').textContent = n === tot ? '🎉 Ranselmu siap! Tinggal berangkat.' : n >= tot * .6 ? `Hampir siap — tinggal ${tot - n} barang lagi.` : 'Centang barang yang sudah kamu siapkan. Kami bisa menyewakan sisanya.'
  $$('.rin-it').forEach((b, i) => b.classList.toggle('on', GEAR_ON.has(i)))
}
Object.assign(HOOK, {
  click: (e, t, d) => { if (d.gear !== undefined) { const i = +d.gear; GEAR_ON.has(i) ? GEAR_ON.delete(i) : GEAR_ON.add(i); drawRing(); return true } return false },
  boot: () => { if (FIXP === null) updateClimb(0) },
})
const hikerSvg = '<svg viewBox="0 0 70 100" aria-hidden="true"><g class="bod"><rect x="14" y="26" width="30" height="36" rx="9" fill="#c4512a"/><rect x="18" y="30" width="22" height="26" rx="6" fill="#1d2a22"/><circle cx="34" cy="14" r="10" fill="#f3c9a0"/><path d="M24 12Q34 0 44 12Z" fill="#2f6f5e"/><path d="M44 36L58 52" stroke="#1d2a22" stroke-width="4" stroke-linecap="round"/><path d="M58 48V90" stroke="#8a6a3a" stroke-width="3"/></g><g class="lg1"><rect x="24" y="58" width="9" height="30" rx="4" fill="#2a3a52"/><rect x="21" y="86" width="14" height="7" rx="3" fill="#1d1d1d"/></g><g class="lg2"><rect x="35" y="58" width="9" height="30" rx="4" fill="#33466a"/><rect x="33" y="86" width="14" height="7" rx="3" fill="#1d1d1d"/></g></svg>'

<section class="rin-climb" id="rin-beranda">

    <div class="rin-hint">Gulir untuk mendaki ↓</div>

  </div>
</section>
${destSection(['Paket pendakian', 'Pilih <em>rutemu</em>', 'Pilih tanggal untuk melihat kursi yang masih tersedia. Kuota pendakian dibatasi demi keselamatan.'])}
<section id="rin-ransel" class="rin-sec"><div class="rin-wrap">
  <div class="rin-head rv"><span class="rin-kicker">Persiapan</span><h2>Sudah siap <em>ransel?</em></h2><p>Centang perlengkapan yang sudah kamu miliki. Yang belum, bisa kami sewakan di basecamp.</p></div>
  <div class="rin-pack rv"><div><div class="rin-ring"><svg viewBox="0 0 220 220"><circle class="bg" cx="110" cy="110" r="100"/><circle class="fg" id="rinFg" cx="110" cy="110" r="100"/></svg><div class="rin-ring-in"><div><b id="rinPct">0%</b><span>ransel siap</span></div></div></div><p class="rin-tip" id="rinTip"></p></div>
    <div class="rin-items">${D.gear.map((g, i) => `<button class="rin-it" data-gear="${i}"><span>${g[0]}</span><span>${g[1]}</span><span class="ck">✓</span></button>`).join('')}</div></div>
</div></section>
${band([[`<div class="rin-fl" style="left:10%;top:26%;width:200px">${svgEl('<ellipse cx="60" cy="40" rx="56" ry="18" fill="#fff" opacity=".9"/><ellipse cx="40" cy="30" rx="30" ry="18" fill="#fff" opacity=".9"/><ellipse cx="82" cy="28" rx="28" ry="20" fill="#fff" opacity=".9"/>', '0 0 120 80')}</div><div class="rin-fl" style="left:70%;top:50%;width:260px">${svgEl('<ellipse cx="60" cy="40" rx="56" ry="18" fill="#fff" opacity=".85"/><ellipse cx="40" cy="30" rx="30" ry="18" fill="#fff" opacity=".85"/><ellipse cx="82" cy="28" rx="28" ry="20" fill="#fff" opacity=".85"/>', '0 0 120 80')}</div>`, 0.2, 24], ['<div class="rin-q-in"><p>Puncak bukan tujuan akhir. Itu hanya tempat untuk melihat pulang.</p></div>', 0]], 360, 'rin-q')}
${galleryHTML(D.gallery)}${aboutHTML()}${foot()}`
  drawGrid(); drawRing(); lastP = -1; updateClimb(0)
}

boot()
</script>
